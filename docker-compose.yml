version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: forecast_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  mongo_data:
